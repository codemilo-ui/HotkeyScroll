name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore RobloxHotbarScroll.sln

      - name: Build Project
        run: dotnet build RobloxHotbarScroll.sln -c Release --no-restore

      - name: Run Tests
        run: dotnet test RobloxHotbarScroll.sln -c Release --no-build --verbosity normal
