name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Release Version
        id: resolve_version
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($inputVer)) {
            $inputVer = "1.2.0"
          }
          $cleanVer = $inputVer.TrimStart('v', 'V')
          $tagName = "v$cleanVer"
          Write-Host "Manual Release -> Version: $cleanVer, Tag: $tagName"
          echo "VERSION=$cleanVer" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

      - name: Restore Dependencies (win-x64)
        run: dotnet restore RobloxHotbarScroll.sln -r win-x64

      - name: Run Test Suite (Release)
        run: dotnet test RobloxHotbarScroll.sln -c Release --no-restore --verbosity normal

      - name: Publish Windows x64 Application
        run: >
          dotnet publish RobloxHotbarScroll/RobloxHotbarScroll.csproj
          -c Release
          -r win-x64
          --no-restore
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.resolve_version.outputs.VERSION }}
          -o ./publish_dist

      - name: Verify and Clean Published Distribution
        shell: pwsh
        run: |
          # Remove any debug/PDB symbols from distribution
          Get-ChildItem -Path ./publish_dist -Filter "*.pdb" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          # Verify standalone executable was created
          $exePath = "./publish_dist/HotkeyScroll.exe"
          if (!(Test-Path $exePath)) {
            Write-Error "CRITICAL: HotkeyScroll.exe was not found in ./publish_dist!"
            exit 1
          }

          Write-Host "Verified production build:"
          Get-Item $exePath | Format-List FullName, Length

      - name: Create Distribution ZIP Package
        shell: pwsh
        run: |
          $zipName = "HotkeyScroll-${{ steps.resolve_version.outputs.TAG_NAME }}-win-x64.zip"
          Compress-Archive -Path ./publish_dist/* -DestinationPath $zipName -Force
          Write-Host "Distribution archive ready: $zipName"
          Get-Item $zipName | Format-List FullName, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "HotkeyScroll ${{ steps.resolve_version.outputs.TAG_NAME }}"
          tag_name: ${{ steps.resolve_version.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          files: HotkeyScroll-${{ steps.resolve_version.outputs.TAG_NAME }}-win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
